name: CellGuard CI

on:
  push:
    paths:
      - "projects/2026-10-26-cellguard/**"
      - ".github/workflows/cellguard-ci.yml"
  pull_request:
    paths:
      - "projects/2026-10-26-cellguard/**"
      - ".github/workflows/cellguard-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: projects/2026-10-26-cellguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q cellguard tests scripts
      - name: Unit, isolation, integrity, lease, and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible validation
        run: python scripts/validate.py

  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/2026-10-26-cellguard
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root image
        run: docker build --tag cellguard:test .
      - name: Test restricted image
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=128m
          --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 128
          cellguard:test
          python -m unittest discover -s tests -v
      - name: Demo restricted image
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=128m
          --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 128
          cellguard:test
