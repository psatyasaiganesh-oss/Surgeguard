name: TraceLens CI

on:
  push:
    paths:
      - "projects/2026-10-16-tracelens/**"
      - ".github/workflows/tracelens-ci.yml"
  pull_request:
    paths:
      - "projects/2026-10-16-tracelens/**"
      - ".github/workflows/tracelens-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: projects/2026-10-16-tracelens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q tracelens tests
      - name: Test
        run: python -m unittest discover -v
      - name: Run deterministic demo
        run: |
          python -m tracelens demo > demo-ci.json
          python -c 'import json; assert json.load(open("demo-ci.json", encoding="utf-8"))["success"]'

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tested image
        run: docker build -t tracelens-ci projects/2026-10-16-tracelens
      - name: Run deterministic demo as non-root
        run: |
          docker run --rm tracelens-ci demo > demo-container.json
          python -c 'import json; assert json.load(open("demo-container.json", encoding="utf-8"))["success"]'
