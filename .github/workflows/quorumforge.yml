name: QuorumForge

on:
  push:
    paths:
      - "projects/2026-10-14-quorumforge/**"
      - ".github/workflows/quorumforge.yml"
  pull_request:
    paths:
      - "projects/2026-10-14-quorumforge/**"
      - ".github/workflows/quorumforge.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/2026-10-14-quorumforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q quorumforge tests scripts
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run deterministic fault lab
        run: python -m quorumforge demo --keys 600 --seed 14 --json /tmp/quorumforge-demo.json > /dev/null
      - name: Build and run container
        run: |
          docker build -t quorumforge .
          docker run --rm quorumforge demo --keys 200 --seed 14 > /tmp/quorumforge-container.json
