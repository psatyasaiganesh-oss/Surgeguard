[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabletforge"
version = "0.1.0"
description = "Crash-recoverable LSM-tree storage engine laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "psatyasaiganesh-oss"}]
dependencies = []

[project.scripts]
tabletforge = "tabletforge.__main__:main"

[tool.setuptools]
packages = ["tabletforge"]
