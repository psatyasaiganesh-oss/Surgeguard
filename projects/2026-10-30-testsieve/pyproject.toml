[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testsieve"
version = "0.1.0"
description = "Conservative dynamic test-impact analysis laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "psatyasaiganesh-oss"}]
dependencies = []

[project.scripts]
testsieve = "testsieve.__main__:main"

[tool.setuptools]
packages = ["testsieve"]
