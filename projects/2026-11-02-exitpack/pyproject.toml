[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "exitpack"
version = "0.1.0"
description = "Lifetime-aware, revision-fenced VM placement control-plane lab"
requires-python = ">=3.11"
authors = [{name = "Independent engineering project"}]
dependencies = []

[project.scripts]
exitpack = "exitpack.__main__:main"

[tool.setuptools.packages.find]
include = ["exitpack*"]
