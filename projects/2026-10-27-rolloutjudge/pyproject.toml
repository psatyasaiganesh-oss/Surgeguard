[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rolloutjudge"
version = "1.0.0"
description = "Durable statistical canary-release judgment lab"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Satya Sai Ganesh"}]

[project.scripts]
rolloutjudge = "rolloutjudge.__main__:main"

[tool.setuptools]
packages = ["rolloutjudge"]
